#

#
# On creating a new tag, we release our maven artifacts to Maven Central
# (namespace dev.dit). The release is automatic and permanent: once Central
# has validated the upload, the version is published and cannot be changed.
#
name: Release

on: create

permissions:
  contents: read
  pull-requests: write
jobs:
  publish:
    name: Test and publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The Maven Central credentials live in this environment, which only
    # version tags (X.Y.Z) may use.
    environment: maven-central
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Verify release tag
        uses: ditdotdev/.github/actions/verify-release-tag@master
      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com" > ~/.git-credentials
        shell: bash
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/ditdotdev/*
          go env -w GONOPROXY=github.com/ditdotdev/*
          go env -w GONOSUMDB=github.com/ditdotdev/*
          go env -w GOPROXY=https://proxy.golang.org,direct
        shell: bash
        env:
          GOPRIVATE: github.com/ditdotdev/*
          GONOPROXY: github.com/ditdotdev/*
          GONOSUMDB: github.com/ditdotdev/*
      - name: Build and test
        run: ./gradlew build -Pversion=${GITHUB_REF#refs/tags/}
        shell: bash
        env:
          GOPRIVATE: github.com/ditdotdev/*
          GONOPROXY: github.com/ditdotdev/*
          GONOSUMDB: github.com/ditdotdev/*
          GIT_TERMINAL_PROMPT: 0
      - name: Release signed jar to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -Pversion=${GITHUB_REF#refs/tags/}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
